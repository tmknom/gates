scan:
  markdown:
    - "docs/**/*.md"
  go:
    - "main.go"
    - "internal/**/*.go"
    - "formal/**/*.go"
    - ".github/**/*.go"
  line_comment_declarations:
    - paths:
        - "formal/alloy/**/*.als"
      comments:
        - "//"
        - "--"
    - paths:
        - "formal/z3/checks/**/*.smt2"
      comments:
        - ";"
    - paths:
        - "terraform/tests/**/*.tftest.hcl"
      comments:
        - "#"
allowed_dependencies:
  - from: "docs/CONSTITUTION.md"
    to: []
  - from: "docs/research/**"
    to: []
  - from: "docs/spec/requirements.md"
    to:
      - "docs/CONSTITUTION.md"
      - "docs/research/**"
      - "!docs/**/README.md"
  - from: "docs/spec/acceptance-criteria.md"
    to:
      - "docs/spec/requirements.md"
  - from: "docs/spec/scope.md"
    to:
      - "docs/CONSTITUTION.md"
      - "docs/spec/requirements.md"
  - from: "docs/design/architecture.md"
    to:
      - "docs/CONSTITUTION.md"
      - "docs/spec/**"
      - "docs/external/**"
      - "docs/research/**"
      - "!docs/spec/scope.md"
      - "!docs/**/README.md"
  - from: "docs/design/**"
    to:
      - "docs/CONSTITUTION.md"
      - "docs/spec/**"
      - "docs/design/**"
      - "docs/external/**"
      - "docs/research/**"
      - "!docs/**/README.md"
  - from: "docs/external/standards/**"
    to: []
  - from: "docs/external/github/**"
    to:
      - "docs/research/github/**"
      - "!docs/**/README.md"
  - from: "docs/user-guide/overview.md"
    to:
      - "docs/**"
      - "formal/README.md"
      - "!docs/contributing/**"
      - "!docs/**/README.md"
  - from: "docs/user-guide/security-considerations.md"
    to:
      - "docs/**"
      - "formal/README.md"
      - "!docs/contributing/**"
      - "!docs/**/README.md"
  - from: "docs/user-guide/**"
    to:
      - "docs/user-guide/**"
      - "!docs/**/README.md"

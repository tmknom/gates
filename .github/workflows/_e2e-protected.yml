name: E2E Protected Repositories
on:
  workflow_dispatch:

permissions: {}

# 同じ Lambda を呼ぶ E2E テストを重ねない
concurrency:
  group: gates-e2e
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# 検証環境の固定の保護対象の一覧で、保護対象の条件による認可拒否を確かめる。
# 許可 Caller に当たる要求の発行は E2E Success が確かめる（1 つ目の対象は保護対象で、試験用のリポジトリが許可 Caller）。
# 保護対象の一覧と事例は docs/contributing/e2e-tests.md の Protected Repositories Cases にある
jobs:
  issue:
    name: Case (${{ matrix.case }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # targets は対象の並び。primary と secondary は Installation の 2 つの対象で、ほかは一覧にだけある実在しないリポジトリの名前である。
        # どの事例も保護対象の条件で拒否され、KMS と GitHub API に進まない
        include:
          - { case: no-allowed-callers, targets: "gates-e2e-no-callers", permissions: "contents:read" }
          - { case: other-caller, targets: "gates-e2e-other-caller", permissions: "contents:read" }
          - { case: caller-name-mismatch, targets: "gates-e2e-caller-name-mismatch", permissions: "contents:read" }
          - { case: caller-id-mismatch, targets: "gates-e2e-caller-id-mismatch", permissions: "contents:read" }
          - { case: above-caller-limit, targets: "gates-e2e-read-only", permissions: "issues:write" }
          - { case: unlisted-permission, targets: "gates-e2e-read-only", permissions: "pull_requests:read" }
          - { case: mixed-other-caller, targets: "primary,gates-e2e-other-caller", permissions: "contents:read" }
          - { case: mixed-above-caller-limit, targets: "secondary,gates-e2e-read-only", permissions: "issues:write" }
    steps:
      - name: Prepare repositories
        id: input
        env:
          TARGETS: ${{ matrix.targets }}
          PRIMARY: ${{ vars.GATES_TARGET_PRIMARY }}
          SECONDARY: ${{ vars.GATES_TARGET_SECONDARY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repositories=()
          IFS=',' read -ra targets <<< "${TARGETS}"
          for target in "${targets[@]}"; do
            case "${target}" in
              primary) repositories+=("${PRIMARY}") ;;
              secondary) repositories+=("${SECONDARY}") ;;
              gates-e2e-*) repositories+=("${OWNER}/${target}") ;;
              *) echo "::error::unknown target: ${target}"; exit 1 ;;
            esac
          done
          echo "repositories=$(IFS=','; echo "${repositories[*]}")" >> "${GITHUB_OUTPUT}"

      - name: Issue token
        id: gates
        continue-on-error: true
        uses: tmknom/gates/actions/issue-token@8990cb90e2dea67260f1fb4da9372fc107d14b75
        with:
          repositories: ${{ steps.input.outputs.repositories }}
          permissions: ${{ matrix.permissions }}
          role-arn: arn:aws:iam::${{ secrets.GATES_AWS_ACCOUNT_ID }}:role/${{ vars.GATES_ROLE_NAME }}
          function-name: ${{ vars.GATES_FUNCTION_NAME }}
          aws-region: ${{ vars.GATES_AWS_REGION }}
          audience: ${{ vars.GATES_AUDIENCE }}

      # どの事例も Action が失敗し、Output が空であることを確かめる。値は出さず長さだけを出す
      - name: Check result
        env:
          OUTCOME: ${{ steps.gates.outcome }}
          GH_TOKEN: ${{ steps.gates.outputs.token }}
          EXPIRES_AT: ${{ steps.gates.outputs.expires-at }}
          OUTPUT_REPOSITORIES: ${{ steps.gates.outputs.repositories }}
          OUTPUT_PERMISSIONS: ${{ steps.gates.outputs.permissions }}
        run: |
          set -euo pipefail
          echo "outcome: ${OUTCOME}"
          failed=0
          fail() {
            echo "::error::$1"
            failed=1
          }
          [[ "${OUTCOME}" == "failure" ]] || fail "the Action did not fail"
          for name in GH_TOKEN EXPIRES_AT OUTPUT_REPOSITORIES OUTPUT_PERMISSIONS; do
            value="${!name}"
            echo "${name} length: ${#value}"
            [[ -z "${value}" ]] || fail "${name} is not empty"
          done
          exit "${failed}"

  # 各事例のジョブのログで、authorization_denied の注釈と、post-entrypoint が失効を試みずに終えたことを確かめる。
  # 一致した行は出さず、件数と GATES の request_id だけを出す
  logs:
    name: Check job logs
    needs: issue
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Check annotations and post-entrypoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # authorization_denied の固定の文言（docs/design/lambda.md）
          message='The requested token is not permitted\.'

          jobs_json="$(gh api --paginate "repos/${REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" --jq '.jobs[]')"

          # ログは色付けのエスケープシーケンスを含み、gh api はその出力を拒否するため curl で取得する。
          # ジョブの完了の直後はログを取得できないことがあるため、空でないログを得るまで待つ
          fetch_log() {
            local log
            for _ in 1 2 3 4 5 6; do
              if log="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                "${GITHUB_API_URL}/repos/${REPOSITORY}/actions/jobs/$1/logs")" && [[ -n "${log}" ]]; then
                printf '%s' "${log}"
                return 0
              fi
              sleep 10
            done
            return 1
          }
          count() {
            grep -c -E -e "$1" <<< "$2" || true
          }

          failed=0
          report() {
            echo "::error::$1"
            failed=1
          }
          for case in no-allowed-callers other-caller caller-name-mismatch caller-id-mismatch \
            above-caller-limit unlisted-permission mixed-other-caller mixed-above-caller-limit; do
            name="Case (${case})"
            job="$(jq -c --arg name "${name}" 'select(.name == $name)' <<< "${jobs_json}")"
            if [[ -z "${job}" ]]; then
              report "${name}: no job"
              continue
            fi
            if ! log="$(fetch_log "$(jq -r '.id' <<< "${job}")")"; then
              report "${name}: cannot fetch the log"
              continue
            fi

            invoking="$(count 'Invoking the Lambda function at ' "${log}")"
            post="$(count '--entrypoint "/revoke-token"' "${log}")"
            revocation="$(count 'revocation (succeeded|failed)' "${log}")"
            warning="$(count '##\[warning\]' "${log}")"
            outcome="$(count "##\[error\]GATES returned a failure response: error code \"authorization_denied\", message \"${message}\", request id \"[^\"]+\"" "${log}")"
            echo "${name}: outcome ${outcome}, invoking ${invoking}, post-entrypoint ${post}, revocation ${revocation}, warning ${warning}"
            [[ "${outcome}" -ge 1 ]] || report "${name}: the authorization_denied annotation is missing"
            [[ "${invoking}" == 1 ]] || report "${name}: the Lambda function was not invoked once"
            [[ "${post}" == 1 ]] || report "${name}: the post-entrypoint did not run"
            [[ "${warning}" == 0 ]] || report "${name}: a warning was written"
            [[ "${revocation}" == 0 ]] || report "${name}: a revocation was attempted"

            # GATES の request_id は資格情報ではなく、監査記録を引くために出す
            request_id="$(grep -o -E 'request_id=[^ ]+|request id "[^"]+"' <<< "${log}" | head -n 1 || true)"
            [[ -z "${request_id}" ]] || echo "${name}: ${request_id}"
          done
          if [[ "${failed}" != 0 ]]; then
            echo "::error::at least one case is not as expected"
            exit 1
          fi

  credential-leak:
    name: Credential leak
    needs: [issue, logs]
    if: ${{ always() }}
    permissions:
      actions: read
    uses: ./.github/workflows/_e2e-reusable-credential-leak.yml

name: Release
on:
  workflow_dispatch:
    inputs:
      bump-level:
        type: choice
        required: true
        description: The level to bump the version. auto determines it from the labels of the pull requests merged since the latest tag.
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions: {}

# 同じバージョンを 2 つの実行が計算しないよう、実行を重ねない
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# 取り消せない処理ほど後に置く。
# test ジョブの if は誤った起動を防ぐためのもので、後続のジョブは needs で test に連なるため一緒に skip される。
# 改ざんへの備えは利用者による Attestation の検証にある
jobs:
  test:
    if: ${{ github.ref == 'refs/heads/main' && github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          for dir in . .github/actions/issue-token; do
            echo "::group::${dir}"
            go -C "${dir}" mod download
            go -C "${dir}" mod verify
            go -C "${dir}" vet ./...
            go -C "${dir}" test -count=1 ./...
            echo "::endgroup::"
          done

  version:
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      # 前回のタグからマージされた PR を探すため、すべての履歴とタグを取得する
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine Version Level
        id: determine
        if: ${{ inputs.bump-level == 'auto' }}
        uses: tmknom/determine-version-level-action@83449961162020e90bb0cd55acb99cc695526221 # v0.2.1

      - name: Bump Version
        id: bump
        uses: tmknom/bump-version-action@87bed7f224292cab5b46a4cae9897bbf64153f00 # v0.2.1
        with:
          bump-level: ${{ steps.determine.outputs.bump-level || inputs.bump-level }}

  build:
    needs: [version]
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  # 各ステップの env には、そのステップが使う値だけを置き、GH_TOKEN は gh を呼ぶステップにだけ渡す
  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # attestations: read は、公開の前後の検証で gh attestation verify が Attestation を取得するのに要る
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/artifact

      - name: Verify artifact
        working-directory: ${{ runner.temp }}/artifact
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.package-name }}
          PACKAGE_DIGEST: ${{ needs.build.outputs.package-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          read -r hex _ < <(sha256sum "${PACKAGE_NAME}")
          if [[ "sha256:${hex}" != "${PACKAGE_DIGEST}" ]]; then
            echo "::error::The digest of ${PACKAGE_NAME} does not match the build output"
            exit 1
          fi
          gh attestation verify "${PACKAGE_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/reusable-build.yml" \
            --signer-digest "${GITHUB_SHA}" \
            --source-ref refs/heads/main \
            --source-digest "${GITHUB_SHA}" \
            --deny-self-hosted-runners

      - name: Publish release
        working-directory: ${{ runner.temp }}/artifact
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE_NAME: ${{ needs.build.outputs.package-name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "${VERSION}" --draft=false --generate-notes "${PACKAGE_NAME}" SHA256SUMS

      - name: Verify release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE_NAME: ${{ needs.build.outputs.package-name }}
          PACKAGE_DIGEST: ${{ needs.build.outputs.package-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/release"
          gh release download "${VERSION}" --repo "${GITHUB_REPOSITORY}" --dir "${dir}"
          cd "${dir}"
          sha256sum -c SHA256SUMS
          read -r hex _ < <(sha256sum "${PACKAGE_NAME}")
          if [[ "sha256:${hex}" != "${PACKAGE_DIGEST}" ]]; then
            echo "::error::The digest of ${PACKAGE_NAME} in the release does not match the build output"
            exit 1
          fi
          gh attestation verify "${PACKAGE_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/reusable-build.yml" \
            --signer-digest "${GITHUB_SHA}" \
            --source-ref refs/heads/main \
            --source-digest "${GITHUB_SHA}" \
            --deny-self-hosted-runners

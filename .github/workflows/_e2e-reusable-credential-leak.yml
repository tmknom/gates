name: E2E Reusable Credential Leak
on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

# 呼び出し元のワークフロー実行のうち、完了したジョブのログ全体に資格情報の文字列がないことを確かめる。
# 一致した行は出さず、ジョブごとの件数だけを出す。行を出すと、このジョブのログが資格情報を含むため。
jobs:
  search:
    name: Search job logs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Search job logs for credentials
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # ghs_ は Installation Access Token、eyJ は JWT（OIDC JWT と GitHub App JWT）、ASIA は AWS 一時認証情報のアクセスキー ID の先頭である。
          # AWS はセッショントークンの形式を公開していない。FwoG は実際に発行されたトークンで、IQoJ は STS API Reference の応答例で見た先頭で、
          # どちらも検出の手がかりにすぎない。シークレットアクセスキーは決まった先頭を持たず、この検索では見つけられない
          PATTERN: ghs_|eyJ|ASIA|FwoG|IQoJ
        run: |
          set -euo pipefail
          jobs="$(gh api --paginate "repos/${REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" \
            --jq '.jobs[] | select(.status == "completed") | "\(.id)\t\(.name)"')"
          if [[ -z "${jobs}" ]]; then
            echo "::error::no completed job to search"
            exit 1
          fi

          # ログは色付けのエスケープシーケンスを含み、gh api はその出力を拒否するため curl で取得する。
          # API は署名付きの URL へリダイレクトし、curl は別のホストへ Authorization を転送しない。
          # ジョブの完了の直後はログを取得できないことがあるため、空でないログを得るまで待つ
          fetch_log() {
            local log
            for _ in 1 2 3 4 5 6; do
              if log="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                "${GITHUB_API_URL}/repos/${REPOSITORY}/actions/jobs/$1/logs")" && [[ -n "${log}" ]]; then
                printf '%s' "${log}"
                return 0
              fi
              sleep 10
            done
            return 1
          }

          failed=0
          while IFS=$'\t' read -r id name; do
            if ! log="$(fetch_log "${id}")"; then
              echo "::error::cannot fetch the log of ${name}"
              failed=1
              continue
            fi
            count="$(grep -c -E "${PATTERN}" <<< "${log}" || true)"
            echo "${name}: ${count} matching lines in $(wc -l <<< "${log}") lines"
            [[ "${count}" == "0" ]] || failed=1
          done <<< "${jobs}"
          if [[ "${failed}" != 0 ]]; then
            echo "::error::job logs contain credential-like strings or could not be searched"
            exit 1
          fi

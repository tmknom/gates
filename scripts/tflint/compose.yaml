# tflint を隔離して実行するサービス定義
#
# 環境変数は Makefile が設定する。
#   TFLINT_TARGET  lint するディレクトリの絶対パス

name: tflint

services:
  lint:
    # Makefile の tflint が実行のたびにビルドする。localhost/ を付け、Docker Hub の同名のイメージを取ってこないようにする
    build: .
    image: localhost/gates-tflint:latest
    pull_policy: never
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      # 手元の値を空の tmpfs で覆い、コンテナから隠す
      - /src/local:ro,noexec,nosuid,nodev,size=1m
    network_mode: none
    ipc: none
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    cpus: 1
    ulimits:
      core: 0
    init: true
    working_dir: /src
    environment:
      HOME: /tmp
    volumes:
      - type: bind
        source: ${TFLINT_TARGET:?TFLINT_TARGET is required}
        target: /src
        read_only: true
      - type: bind
        source: ./.tflint.hcl
        target: /config/.tflint.hcl
        read_only: true
    command:
      - --recursive
      - --config=/config/.tflint.hcl

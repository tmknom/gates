# tflint を隔離して実行するサービス定義
#
# 環境変数は Makefile が設定する。
#   TFLINT_TARGET  lint するディレクトリの絶対パス

name: tflint

services:
  lint:
    # Makefile の tflint が実行のたびにビルドする。localhost/ を付け、Docker Hub の同名のイメージを取ってこないようにする
    build: .
    image: localhost/gates-tflint:latest
    pull_policy: never
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      # --recursive は gitignore を見ないため、検査に不要なディレクトリを空の tmpfs で覆い、検査対象から外してコンテナからも隠す。
      # 隠すパスは .gitignore と連動せず、ここに列挙していないものはコンテナから読める。
      # 追加するときは Makefile の container-mountpoints と scripts/trivy/compose.yaml も更新する
      - /src/.claude:ro,noexec,nosuid,nodev,size=1m
      - /src/.git:ro,noexec,nosuid,nodev,size=1m
      - /src/.makefiles:ro,noexec,nosuid,nodev,size=1m
      - /src/dist:ro,noexec,nosuid,nodev,size=1m
      - /src/tmp:ro,noexec,nosuid,nodev,size=1m
    network_mode: none
    ipc: none
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    cpus: 1
    ulimits:
      core: 0
    init: true
    working_dir: /src
    environment:
      HOME: /tmp
    volumes:
      # TODO: Terraform のコードを追加したら、Makefile の TFLINT_TARGET をそのディレクトリに絞り、/src 配下を隠す tmpfs と .envrc のマウント、Makefile の container-mountpoints への依存を外す
      - type: bind
        source: ${TFLINT_TARGET:?TFLINT_TARGET is required}
        target: /src
        read_only: true
      # tmpfs はファイルを覆えないため、/dev/null を重ねて .envrc の中身をコンテナから隠す
      - type: bind
        source: /dev/null
        target: /src/.envrc
        read_only: true
      - type: bind
        source: ./.tflint.hcl
        target: /config/.tflint.hcl
        read_only: true
    command:
      - --recursive
      - --config=/config/.tflint.hcl

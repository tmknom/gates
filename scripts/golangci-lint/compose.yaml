# golangci-lint を隔離して実行するサービス定義
#
# 環境変数は Makefile が設定する。
#   LINT_MODULE      lint する Go モジュールのディレクトリの絶対パス
#   LINT_GOMODCACHE  ホストのモジュールキャッシュの絶対パス（go env GOMODCACHE）

name: golangci-lint

services:
  lint:
    image: docker.io/golangci/golangci-lint:v2.14.0@sha256:ad862ba6b3798cbe0fd9fd7408d498fd74fbd2623a92406b2fd3898faf0bf98f
    pull_policy: missing
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g
      # lint に不要なディレクトリを空の tmpfs で覆い、コンテナから隠す。
      # 隠すパスは .gitignore と連動せず、ここに列挙していないものはコンテナから読める。
      # 追加するときは Makefile の container-mountpoints と scripts/tflint/compose.yaml、scripts/trivy/compose.yaml も更新する
      - /src/.claude:ro,noexec,nosuid,nodev,size=1m
      - /src/.git:ro,noexec,nosuid,nodev,size=1m
      - /src/.makefiles:ro,noexec,nosuid,nodev,size=1m
      - /src/dist:ro,noexec,nosuid,nodev,size=1m
      - /src/tmp:ro,noexec,nosuid,nodev,size=1m
    network_mode: none
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    cpus: 2
    init: true
    working_dir: /src
    environment:
      HOME: /tmp
      GOCACHE: /tmp/go-build
      GOLANGCI_LINT_CACHE: /tmp/golangci-lint
      GOMODCACHE: /gomodcache
      GOFLAGS: -mod=readonly
      GOPROXY: "off"
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    volumes:
      - type: bind
        source: ${LINT_MODULE:?LINT_MODULE is required}
        target: /src
        read_only: true
      # tmpfs はファイルを覆えないため、/dev/null を重ねて .envrc と .env の中身をコンテナから隠す
      - type: bind
        source: /dev/null
        target: /src/.envrc
        read_only: true
      - type: bind
        source: /dev/null
        target: /src/.env
        read_only: true
      - type: bind
        source: ${LINT_GOMODCACHE:?LINT_GOMODCACHE is required}
        target: /gomodcache
        read_only: true
      - type: bind
        source: ./.golangci.yml
        target: /config/.golangci.yml
        read_only: true
    command:
      - golangci-lint
      - run
      - --config=/config/.golangci.yml
      - --timeout=5m
      - ./...

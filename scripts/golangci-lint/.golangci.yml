version: "2"

# 既定の cfg では設定ファイルのある /config が基準になり、パスが ../src/ で始まるため、go.mod のあるモジュールのルートを基準にする
run:
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocritic
    - gosec
    - govet
    - ineffassign
    - iotamixing
    - makezero
    - modernize
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - unparam
    - unused
    - usetesting
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam
        text: always receives
      - path: ^main\.go$
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - forbidigo
        text: "use of `time\\.(Now|Since|Until)`"
      - path: _test\.go
        linters:
          - forbidigo
        text: "use of `((caller\\.)?NewCaller|(github\\.)?NewAppJWT)`"
      # メソッドの違反は、変数の名前で表記が変わるため、メッセージで照合する
      - path: ^internal/request/.*_test\.go$
        linters:
          - forbidigo
        text: "only internal/authn may expose the unverified ID token"
      - path: ^internal/authn/
        linters:
          - forbidigo
        text: "use of `caller\\.NewCaller`|only internal/authn may expose the unverified ID token"
      - path: ^internal/signer/
        linters:
          - forbidigo
        text: "use of `github\\.NewAppJWT`"
      # GitHub Client 自身は非公開の expose で値を読むため、除外はテストだけに置く
      - path: ^internal/github/.*_test\.go$
        linters:
          - forbidigo
        text: "only internal/handler may expose the installation access token"
      - path: ^internal/handler/
        linters:
          - forbidigo
        text: "only internal/handler may expose the installation access token"
      # internal/nonzero は panic してよい唯一の package である。テストは対象にし、準備の失敗は t.Fatal や t.Error で示す
      - path: ^internal/nonzero/nonzero\.go$
        linters:
          - forbidigo
        text: "only internal/nonzero may panic"
  settings:
    depguard:
      rules:
        archived:
          list-mode: lax
          deny:
            - pkg: gopkg.in/yaml.v3
              desc: archived; use go.yaml.in/yaml/v3
        # 入力、固定設定、認可の処理と、ドメインの値の package は、通信と外部ライブラリを持たない。副作用をこれらの package に入れず、テストを通信なしで書けるようにするため
        no-communication:
          list-mode: lax
          files:
            - "**/internal/authz/**"
            - "**/internal/caller/**"
            - "**/internal/config/**"
            - "**/internal/githubid/**"
            - "**/internal/permission/**"
            - "**/internal/repository/**"
            - "**/internal/request/**"
            - "**/internal/revocation/**"
          allow:
            - github.com/tmknom/gates/internal
          deny:
            - pkg: net
              desc: input, fixed configuration, authorization, and domain value packages must not communicate
            - pkg: crypto/tls
              desc: input, fixed configuration, authorization, and domain value packages must not communicate
            - pkg: github.com/
              desc: input, fixed configuration, authorization, and domain value packages must not depend on external libraries
        # Token Issuer は通信を GitHub Client と KMS Signer に任せ、自らは通信しない。テストは発行結果を GitHub Client の発行応答から作るため、対象から外す
        tokenissuer-no-communication:
          list-mode: lax
          files:
            - "**/internal/tokenissuer/**"
            - "!$test"
          deny:
            - pkg: net
              desc: internal/tokenissuer must leave communication to internal/github and internal/signer
            - pkg: crypto/tls
              desc: internal/tokenissuer must leave communication to internal/github and internal/signer
        # Lambda Handler は通信を OIDC Verifier、KMS Signer、GitHub Client に任せ、自らは通信しない。テストは成功応答を GitHub Client の発行応答から作るため、対象から外す
        handler-no-communication:
          list-mode: lax
          files:
            - "**/internal/handler/**"
            - "!$test"
          deny:
            - pkg: net
              desc: internal/handler must leave communication to internal/authn, internal/signer, and internal/github
            - pkg: crypto/tls
              desc: internal/handler must leave communication to internal/authn, internal/signer, and internal/github
        # AWS SDK は KMS Signer と、AWS SDK の設定を読む Runtime Entry だけが使う。ほかのコンポーネントのテストが AWS SDK に依存せず、KMS のテストダブルが一つの package に閉じるようにするため
        aws-sdk:
          list-mode: lax
          files:
            - "!**/internal/signer/**"
            - "!**/main.go"
          deny:
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: only internal/signer and main may use the AWS SDK
            - pkg: github.com/aws/smithy-go
              desc: only internal/signer and main may use the AWS SDK
        # Lambda Runtime のライブラリは Runtime Entry だけが使う。Lambda Handler のテストで Lambda の ctx を組み立てずに済ませるため
        lambda-runtime:
          list-mode: lax
          files:
            - "**/internal/**"
          deny:
            - pkg: github.com/aws/aws-lambda-go
              desc: only main may use the Lambda Runtime library
        # 資格情報を伏せる型は、資格情報の型を持つどの package からも使えるよう、標準ライブラリだけに依存する
        credential-standard-library-only:
          list-mode: strict
          files:
            - "**/internal/credential/**"
          allow:
            - $gostd
            - github.com/tmknom/gates/internal/credential
        # GitHub Client は KMS Signer と Token Issuer に依存しない。AppJWT と発行結果を GitHub Client に置き、循環と AWS SDK の間接的な流入を防ぐため
        github-client:
          list-mode: lax
          files:
            - "**/internal/github/**"
          deny:
            - pkg: github.com/tmknom/gates/internal/signer
              desc: internal/github must not depend on internal/signer
            - pkg: github.com/tmknom/gates/internal/tokenissuer
              desc: internal/github must not depend on internal/tokenissuer
        # 監査記録は資格情報を含めない（Domain Model の「資格情報の非記録」）。資格情報の型を import しないことは型単位では禁じられないため、package 単位で限る。
        # 許可する package を完全一致で列挙し、資格情報の型を公開する package を既定で拒否する。
        # internal/request は発行要求のために許し、監査記録が未検証の GATES 用 OIDC JWT を持たないことはレビューで確かめる。テストも対象にし、監査記録に渡せる型を閉じたままにする
        audit-no-credentials:
          list-mode: strict
          files:
            - "**/internal/audit/**"
          allow:
            - $gostd
            - github.com/tmknom/gates/internal/audit$
            - github.com/tmknom/gates/internal/authz$
            - github.com/tmknom/gates/internal/caller$
            - github.com/tmknom/gates/internal/errorcode$
            - github.com/tmknom/gates/internal/nonzero$
            - github.com/tmknom/gates/internal/request$
            - github.com/tmknom/gates/internal/revocation$
          deny:
            - pkg: net
              desc: internal/audit must not communicate
            - pkg: crypto/tls
              desc: internal/audit must not communicate
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Exit|Args|Stdin|Stdout|Stderr|Getwd)$
        - pattern: ^log\.(Fatal|Fatalf|Fatalln)$
        - pattern: ^time\.(Now|Since|Until)$
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
        - pattern: ^slog\.(SetDefault|Default|With|Log|LogAttrs|Debug|Info|Warn|Error|DebugContext|InfoContext|WarnContext|ErrorContext)$
        # panic してよい場合は Lambda Design の「Failure」に記述する
        - pattern: ^panic$
          msg: only internal/nonzero may panic; return an error, or use nonzero.Require for a zero value
        # Caller は検証済みの GATES 用 OIDC JWT だけから作る（Domain Model の Caller の不変条件）。NewCaller は公開関数で、呼び出せる package を型で限定できないため
        - pattern: ^caller\.NewCaller$
          pkg: ^github\.com/tmknom/gates/internal/caller$
          msg: only internal/authn may create a Caller
        # AppJWT は KMS Signer だけが作る。NewAppJWT は公開関数で、呼び出せる package を型で限定できないため
        - pattern: ^github\.NewAppJWT$
          pkg: ^github\.com/tmknom/gates/internal/github$
          msg: only internal/signer may create an AppJWT
        # 未検証の GATES 用 OIDC JWT の値を取り出せるのは OIDC Verifier だけ（Lambda Design の資格情報の表）。Expose は公開メソッドで、呼び出せる package を型で限定できないため
        - pattern: ^request\.UnverifiedIDToken\.Expose$
          pkg: ^github\.com/tmknom/gates/internal/request$
          msg: only internal/authn may expose the unverified ID token
        # Installation Access Token の値を package の外で取り出せるのは、成功応答を書く Lambda Handler だけ（Lambda Design の資格情報の表）。Expose は公開メソッドで、呼び出せる package を型で限定できないため
        - pattern: ^github\.InstallationAccessToken\.Expose$
          pkg: ^github\.com/tmknom/gates/internal/github$
          msg: only internal/handler may expose the installation access token
    gocritic:
      disable-all: true
      enabled-checks:
        - appendAssign
        - argOrder
        - badCall
        - badCond
        - caseOrder
        - codegenComment
        - deprecatedComment
        - dupArg
        - dupBranchBody
        - dupCase
        - dupSubExpr
        - exitAfterDefer
        - flagDeref
        - flagName
        - mapKey
        - offBy1
        - sloppyLen
        - sloppyTypeAssert
    gosec:
      excludes:
        - G115
        - G301
        - G302
        - G304
        - G306
        - G602
    govet:
      disable-all: true
      enable:
        - deepequalerrors
        - inline
        - nilness
        - reflectvaluecompare
        - unusedwrite
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    reassign:
      patterns:
        - ".*"
    revive:
      rules:
        - name: context-as-argument
        - name: defer
          arguments:
            - - recover
              - immediate-recover
        - name: exported
          arguments:
            - disable-checks-on-constants
        - name: forbidden-call-in-wg-go
        - name: time-date
        - name: time-equal
    sloglint:
      no-mixed-args: false
    staticcheck:
      checks:
        - "SA*"
        - ST1003
        - ST1005
        - ST1018

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

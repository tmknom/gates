# 許可リストの宛先への CONNECT だけを通す forward proxy の共通設定。TLS は復号しない
#
# 許可リストは compose.yaml がサービスごとに /config/allow.txt へマウントする

http_port 3128

# -n は宛先の IP アドレスの逆引きを止める。逆引きすると、PTR レコードを許可リストの名前にした IP アドレスを通してしまう
acl allowed_hosts dstdomain -n "/config/allow.txt"
acl https_port port 443
acl connect_method method CONNECT

http_access deny !connect_method
http_access deny !https_port
http_access allow allowed_hosts
http_access deny all

# キャッシュを持たない
cache deny all
cache_mem 8 MB

# ログには宛先のホスト名までが残る
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0

# 読み取り専用のファイルシステムと非 root で動かす
pid_filename none
coredump_dir /tmp

forwarded_for delete
shutdown_lifetime 0 seconds
